<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ward">
  <!-- The header mark's geometry exactly, on a solid tile: a favicon sits on light
       AND dark browser chrome, where the page's thin dark-on-light strokes vanish.
       Same treatment the bundle already uses for its loading thumbnail. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5fd0"/>
      <stop offset="1" stop-color="#16337a"/>
    </linearGradient>
    <radialGradient id="core" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#bcd2f6"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <g stroke="#8fb4f2" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="16" y2="19"/>
    <line x1="32" y1="32" x2="48" y2="19"/>
    <line x1="32" y1="32" x2="32" y2="52"/>
  </g>
  <g fill="#dfe7f7">
    <rect x="8" y="16" width="15" height="5" rx="1.5"/>
    <rect x="41" y="16" width="15" height="5" rx="1.5"/>
    <rect x="24" y="46" width="16" height="5" rx="1.5"/>
  </g>
  <circle cx="32" cy="32" r="8" fill="url(#core)"/>
</svg>
